<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TTS Latency Benchmarker</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; max-width: 1200px; margin: 0 auto; padding: 1rem; }
    h1 { margin-top: 0; }
    section { margin-bottom: 1.5rem; }
    .card { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; margin-bottom: 0.75rem; }
    .card h3 { margin-top: 0; display: flex; justify-content: space-between; align-items: center; }
    label { display: block; margin-top: 0.5rem; font-weight: 500; }
    input, select, textarea { width: 100%; padding: 0.35rem; margin-top: 0.2rem; }
    .row { display: flex; gap: 1rem; flex-wrap: wrap; }
    .row > * { flex: 1 1 120px; }
    button { padding: 0.5rem 1rem; cursor: pointer; }
    .btn-remove { background: #c00; color: #fff; border: none; }
    .regions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .regions label { display: inline-flex; align-items: center; gap: 0.35rem; margin-right: 0.5rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
    th, td { border: 1px solid #ddd; padding: 0.4rem; text-align: left; }
    th { background: #f5f5f5; }
    .ttfb-green { background: #d4edda; }
    .ttfb-amber { background: #fff3cd; }
    .ttfb-red { background: #f8d7da; }
    .expandable { cursor: pointer; }
    .detail-table { margin-left: 1rem; margin-bottom: 0.5rem; }
    .spinner { display: inline-block; width: 1rem; height: 1rem; border: 2px solid #ccc; border-top-color: #333; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <h1>TTS Latency Benchmarker</h1>

  <section>
    <h2>API config</h2>
    <div id="api-cards"></div>
    <button type="button" id="add-api">Add API</button>
  </section>

  <section>
    <h2>Test config</h2>
    <label for="text">Text to synthesize</label>
    <div style="display:flex;gap:0.5rem;align-items:flex-start;flex-wrap:wrap;">
      <textarea id="text" rows="3" style="flex:1;min-width:200px;">Hello, this is a test of text to speech latency.</textarea>
      <button type="button" id="random-text" title="Fill with a random sample sentence">Random text</button>
    </div>
    <label style="margin-top:0.75rem;">Regions</label>
    <div class="regions" id="regions"></div>
    <button type="button" id="run" style="margin-top:0.75rem;">Run benchmark</button>
  </section>

  <section>

    <div id="summary-wrap"></div>

    function voiceOptionsFor(provider, modelSelectValue) {
      if (provider === 'resemble') {
        return [{ v: CUSTOM_OPT, l: 'Custom voice UUID…' }];
      }
      const all = PROVIDER_VOICES[provider] || [];
      if (provider === 'deepgram') {
        return [{ v: '', l: '(voice not used — model only)' }];
      }
      if (modelSelectValue === CUSTOM_OPT) {
        return all.length ? [...all] : [{ v: '', l: 'Default' }];
      }
      const map = MODEL_VOICE_IDS[provider];
      if (!map || !map[modelSelectValue]) {
        return all.length ? [...all] : [{ v: '', l: 'Default' }];
      }
      const byV = new Map(all.map(o => [o.v, o]));
      return map[modelSelectValue].map(v => byV.get(v) || { v, l: v });
    }

    function defaultVoiceForModel(provider, effectiveModel, modelSelectValue) {
      const opts = voiceOptionsFor(provider, modelSelectValue);
      if (!opts.length) return '';
      const d = PROVIDER_DEFAULTS[provider] || {};
      if (provider === 'deepgram') return '';
      if (modelSelectValue === CUSTOM_OPT) {
        return opts.some(o => o.v === d.voiceId) ? d.voiceId : opts[0].v;
      }
      const md = MODEL_DEFAULT_VOICE[provider];
      if (md && effectiveModel && md[effectiveModel] !== undefined) {
        const v = md[effectiveModel];
        if (opts.some(o => o.v === v)) return v;
      }
      if (opts.some(o => o.v === d.voiceId)) return d.voiceId;
      return opts[0].v;
    }

    function fillSelect(sel, options, defaultVal, includeCustom) {
      const opts = [...(options || [])];
      if (includeCustom && !opts.some(o => o.v === CUSTOM_OPT)) {
        opts.push({ v: CUSTOM_OPT, l: 'Custom…' });
      }
      let html = opts.map(o => `<option value="${escapeAttr(o.v)}">${escapeHtml(o.l)}</option>`).join('');
      sel.innerHTML = html;
      const match = opts.find(o => o.v === defaultVal);
      if (match) {
        sel.value = defaultVal;
      } else if (defaultVal && includeCustom) {
        sel.value = CUSTOM_OPT;
      } else if (opts.length) {
        sel.value = opts[0].v;
      }
    }

    function escapeAttr(s) {
      return String(s).replace(/"/g, '&quot;').replace(/</g, '');
    }
    function escapeHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

        </div>`;
      card.innerHTML = `
        <h3>API <span data-name="num">${id}</span>
          <button type="button" class="btn-remove" data-remove>Remove</button>
        </h3>
        <div class="row">
          <label>Provider</label>
          <select data-field="provider">
            ${PROVIDERS.map(p => `<option value="${p.value}">${p.label}</option>`).join('')}
          </select>
        </div>
        <div class="row">
          <label>Display name</label>
          <input type="text" data-field="name" placeholder="e.g. ElevenLabs Turbo">
        </div>
        <div class="row">
          <label>API Key</label>
          <input type="password" data-field="apiKey" placeholder="API key">
        </div>
        ${secretRow}
        <div class="row">
          <label>Voice</label>
          <select data-field="voiceIdSelect"></select>
        </div>
        <div class="row voice-custom-row hidden">
          <label>Custom voice ID / UUID</label>
          <input type="text" data-field="voiceIdCustom" placeholder="Paste voice ID or UUID">
        </div>
        <div class="row">
          <label>Model</label>
          <select data-field="modelSelect"></select>
        </div>
        <div class="row model-custom-row hidden">
          <label>Custom model</label>
          <input type="text" data-field="modelCustom" placeholder="Model id">
        </div>
        <div class="row">
          <label>Concurrency (1–50)</label>
          <input type="number" data-field="concurrency" min="1" max="50" value="1">
        </div>
      `;
      const providerSelect = card.querySelector('[data-field="provider"]');
      const voiceSel = card.querySelector('[data-field="voiceIdSelect"]');
      const modelSel = card.querySelector('[data-field="modelSelect"]');
      const voiceCustom = card.querySelector('[data-field="voiceIdCustom"]');
      const modelCustom = card.querySelector('[data-field="modelCustom"]');
      const voiceCustomRow = card.querySelector('.voice-custom-row');
      const modelCustomRow = card.querySelector('.model-custom-row');
      const secretRowEl = card.querySelector('.api-secret-row');

      function syncCustomRows() {
        const isResemble = providerSelect.value === 'resemble';
        if (isResemble) {
          voiceCustom.placeholder = 'Resemble voice UUID (required)';
          return;
        }
        voiceCustomRow.classList.toggle('hidden', voiceSel.value !== CUSTOM_OPT);
        modelCustomRow.classList.toggle('hidden', modelSel.value !== CUSTOM_OPT);
      }

      function refillVoicesForModel() {
        const provider = providerSelect.value;
        const modelVal = modelSel.value;
        const d = PROVIDER_DEFAULTS[provider] || {};
        if (provider === 'resemble') {
          voiceSel.classList.add('hidden');
          voiceSel.innerHTML = `<option value="${CUSTOM_OPT}">UUID below</option>`;
          voiceCustom.value = '';
          voiceCustomRow.classList.remove('hidden');
          syncCustomRows();
          return;
        }
        voiceSel.classList.remove('hidden');
        const effectiveModel = modelVal === CUSTOM_OPT
          ? (modelCustom.value.trim() || d.model || '')
          : modelVal;
        const voices = voiceOptionsFor(provider, modelVal);
        const defV = defaultVoiceForModel(provider, effectiveModel, modelVal);
        fillSelect(voiceSel, voices, defV, true);
        voiceCustom.value = '';
        syncCustomRows();
      }

      function applyProviderDefaults(provider) {
        const d = PROVIDER_DEFAULTS[provider] || {};
        let models = PROVIDER_MODELS[provider];
        if (!models || !models.length) {
          models = [{ v: d.model || '', l: 'Default' }];
        }
        fillSelect(modelSel, models, d.model, true);
        modelCustom.value = '';

        if (provider === 'resemble') {
          voiceSel.classList.add('hidden');
          voiceSel.innerHTML = `<option value="${CUSTOM_OPT}">UUID below</option>`;
          voiceCustom.value = d.voiceId || '';
          voiceCustomRow.classList.remove('hidden');
          syncCustomRows();
        } else {
          refillVoicesForModel();
        }
        if (secretRowEl) secretRowEl.classList.toggle('hidden', !needsApiSecret(provider));
      }

      voiceSel.addEventListener('change', syncCustomRows);
      modelSel.addEventListener('change', () => {
        refillVoicesForModel();
      });
      providerSelect.addEventListener('change', () => applyProviderDefaults(providerSelect.value));
      applyProviderDefaults(providerSelect.value);

      card.querySelector('[data-remove]').addEventListener('click', () => card.remove());
      return card;
    }

    function addApiCard() {
      document.getElementById('api-cards').appendChild(makeApiCard());
    }

    function collectApis() {
      const cards = document.querySelectorAll('#api-cards .card');
      return Array.from(cards).map(card => {
        const provider = card.querySelector('[data-field="provider"]')?.value || 'elevenlabs';
        const vSel = card.querySelector('[data-field="voiceIdSelect"]');
        const mSel = card.querySelector('[data-field="modelSelect"]');
        const vCust = card.querySelector('[data-field="voiceIdCustom"]');
        const mCust = card.querySelector('[data-field="modelCustom"]');
        let voiceId = '';
        let model = '';
        if (provider === 'resemble') {
          voiceId = (vCust?.value || '').trim();
          model = mSel?.value === CUSTOM_OPT ? (mCust?.value || '').trim() : (mSel?.value || '');
        } else {
          voiceId = vSel?.value === CUSTOM_OPT ? (vCust?.value || '').trim() : (vSel?.value ?? '');
          model = mSel?.value === CUSTOM_OPT ? (mCust?.value || '').trim() : (mSel?.value ?? '');
        }
        const api = {
          id: card.dataset.id || '1',
          name: card.querySelector('[data-field="name"]')?.value || '',
          provider,
          apiKey: card.querySelector('[data-field="apiKey"]')?.value || '',
          voiceId,
          model,
          concurrency: parseInt(card.querySelector('[data-field="concurrency"]')?.value || '1', 10) || 1,
        };
        const secretInput = card.querySelector('[data-field="apiSecret"]');
        if (secretInput && secretInput.value) api.apiSecret = secretInput.value;
        return api;
      });
    }

    function getSelectedRegionCodes() {
      return Array.from(document.querySelectorAll('input[name="region"]:checked')).map(el => el.value);
    }

    function ttfbClass(p50) {
      if (p50 < 300) return 'ttfb-green';
      if (p50 <= 700) return 'ttfb-amber';
      return 'ttfb-red';
    }

    async function runBenchmark() {
      const text = document.getElementById('text').value.trim();
      const apis = collectApis();
      const regionCodes = getSelectedRegionCodes();
      if (!text || !apis.length) {
        alert('Enter text and add at least one API.');
        return;
      }
      if (!regionCodes.length) {
        alert('Select at least one region.');
        return;
      }

      const summaryWrap = document.getElementById('summary-wrap');
      const detailsWrap = document.getElementById('details-wrap');
      summaryWrap.innerHTML = '';
      detailsWrap.innerHTML = '';

      const placeholders = {};
      regionCodes.forEach(regionCode => {
        apis.forEach(api => {
          const key = `${regionCode}:${api.id}`;
          placeholders[key] = { region: regionCode, apiName: api.name, status: 'loading', result: null };
        });
      });

      renderSummaryTable(placeholders, regionCodes, apis);
      renderDetailPlaceholders(placeholders, regionCodes, apis);

      const requests = regionCodes.map(regionCode =>
        fetch(`${BASE_URL}/benchmark`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'fly-prefer-region': regionCode,
          },
          body: JSON.stringify({ text, apis }),
        }).then(async (res) => {
          const data = await res.json().catch(() => ({}));
          return { regionCode, ok: res.ok, data };
        })
      );

      const settled = await Promise.allSettled(requests);

      settled.forEach((out, i) => {
        const regionCode = regionCodes[i];
        if (out.status === 'rejected') {
          apis.forEach(api => {
            placeholders[`${regionCode}:${api.id}`].status = 'error';
            placeholders[`${regionCode}:${api.id}`].error = out.reason?.message || 'Request failed';
          });
        } else {
          const { data } = out.value;
          const results = (data && data.results) || [];
          results.forEach((r, j) => {
            const api = apis[j];
            const key = `${regionCode}:${api?.id || r.apiConfigId}`;
            if (placeholders[key]) {
              placeholders[key].status = 'done';
              placeholders[key].result = r;
            }
          });
        }
      });

      renderSummaryTable(placeholders, regionCodes, apis);
      renderDetails(placeholders, regionCodes, apis);
    }

    function renderSummaryTable(placeholders, regionCodes, apis) {
      const wrap = document.getElementById('summary-wrap');
      const rows = [];
      regionCodes.forEach(regionCode => {
        apis.forEach(api => {
          const key = `${regionCode}:${api.id}`;
          const p = placeholders[key] || {};
          let cells = [p.apiName || api.name, regionCode, p.result ? p.result.concurrency : api.concurrency];
          if (p.status === 'loading') {
            cells.push('<span class="spinner"></span>', '-', '-', '-', '-', '-', '-', '-');
          } else if (p.status === 'error') {
            cells.push('-', '-', '-', '-', '-', '-', '-', p.error || 'Error');
          } else if (p.result) {
            const r = p.result;
            const p50 = (r.ttfbStats && r.ttfbStats.p50) != null ? r.ttfbStats.p50 : 0;
            cells.push(
              (r.ttfbStats && r.ttfbStats.min != null) ? r.ttfbStats.min.toFixed(1) : '-',
              p50.toFixed(1),
              (r.ttfbStats && r.ttfbStats.p95 != null) ? r.ttfbStats.p95.toFixed(1) : '-',
              (r.ttfbStats && r.ttfbStats.max != null) ? r.ttfbStats.max.toFixed(1) : '-',
              (r.ttlbStats && r.ttlbStats.mean != null) ? r.ttlbStats.mean.toFixed(1) : '-',
              r.successCount != null ? r.successCount : '-',
              r.errorCount != null ? r.errorCount : '-'
            );
            cells[4] = `<span class="${ttfbClass(p50)}">${cells[4]}</span>`;
          }
          rows.push(cells);
        });
      });
      wrap.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>API Name</th><th>Region</th><th>Concurrency</th>
              <th>TTFB min</th><th>TTFB p50</th><th>TTFB p95</th><th>TTFB max</th>
              <th>TTLB mean</th><th>Success</th><th>Errors</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map(row => `<tr>${row.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}
          </tbody>
        </table>
      `;
    }

    function renderDetailPlaceholders(placeholders, regionCodes, apis) {
      const wrap = document.getElementById('details-wrap');
      wrap.innerHTML = regionCodes.map(regionCode =>
        apis.map(api => {
          const key = `${regionCode}:${api.id}`;
          return `<div class="card" data-detail-key="${key}"><h4>${api.name} — ${regionCode}</h4><p>Loading…</p></div>`;
        }).join('')
      ).join('');
    }

    function renderDetails(placeholders, regionCodes, apis) {
      const wrap = document.getElementById('details-wrap');
      wrap.innerHTML = '';
      regionCodes.forEach(regionCode => {
        apis.forEach(api => {
          const key = `${regionCode}:${api.id}`;
          const p = placeholders[key] || {};
          const card = document.createElement('div');
          card.className = 'card';
      card.innerHTML = `<h4 class="expandable" data-expand="${key}"><span data-arrow>▼</span> ${api.name} — ${regionCode}</h4>`;
      const body = document.createElement('div');
      body.className = 'detail-body';
      if (p.status === 'loading') {
            body.innerHTML = '<p>Loading…</p>';
          } else if (p.status === 'error') {
            body.innerHTML = `<p>Error: ${p.error || 'Unknown'}</p>`;
          } else if (p.result && p.result.requests && p.result.requests.length) {
            const rows = p.result.requests.map(req =>
              `<tr>
                <td>${req.index}</td>
                <td>${req.error ? '-' : (req.ttfb != null ? req.ttfb.toFixed(1) : '-')}</td>
                <td>${req.error ? '-' : (req.ttlb != null ? req.ttlb.toFixed(1) : '-')}</td>
                <td>${req.error ? '-' : (req.audioSizeBytes != null ? req.audioSizeBytes : '-')}</td>
                <td>${req.error ? req.error : 'OK'}</td>
              </tr>`
            ).join('');
            body.innerHTML = `<table class="detail-table"><thead><tr><th>#</th><th>TTFB (ms)</th><th>TTLB (ms)</th><th>Audio size</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>`;
          } else {
            body.innerHTML = '<p>No request data</p>';
          }
          card.appendChild(body);
          card.querySelector('[data-expand]').addEventListener('click', () => {
            body.classList.toggle('hidden');
            const arrow = card.querySelector('[data-arrow]');
            if (arrow) arrow.textContent = body.classList.contains('hidden') ? '▼' : '▲';
          });
          wrap.appendChild(card);
        });
      });
    }

    document.getElementById('add-api').addEventListener('click', addApiCard);
    document.getElementById('run').addEventListener('click', runBenchmark);
    document.getElementById('random-text').addEventListener('click', pickRandomText);

    renderRegions();
    addApiCard();
  </script>
</body>
</html>
